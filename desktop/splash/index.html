<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Workbench</title>
    <!--
      What the window shows while the services come up.

      **It is a chat screen, not a progress bar.** The user's complaint was exact:

          不要"Starting"那一屏挡在前面。窗口打开 → 直接是聊天框，能看见、能打字。
          底下一行小的状态就行（"正在启动服务…"），就绪之前发送按钮置灰并说明，
          不许拿一整屏遮住用户。

      So there is no full-page checklist and no modal spinner. There is the product's own
      shape — sidebar, conversation area, composer — with the composer **live**: the
      textarea accepts text from the first frame, the send button is greyed with a reason,
      and one small line at the bottom says what is happening.

      Typing is not thrown away. Every keystroke is pushed to the shell
      (`set_startup_draft`), and when the backend answers the shell navigates to the real
      app with `?draft=…`, where the composer picks it up. A screen that let you type and
      then discarded it would be worse than one that never offered.

      Two things this file deliberately does **not** do:

        * it does not duplicate the app's logic. It is chrome and a textarea. The moment
          the real UI is reachable, this file stops existing.
        * it does not claim progress it cannot see. The service rows and the activity line
          come from the shell's real probes and from `startup.log`.

      It is a plain file with no bundler and no network access beyond the shell's events,
      so it cannot fail to load.
    -->
    <style>
      :root {
        --bg: #05070d;
        --panel: #0b111c;
        --edge: #17243a;
        --accent: #22d3ee;
        --accent-dim: #0e7490;
        --text: #e6edf7;
        --muted: #7c8ba1;
        --faint: #55647a;
        --danger: #f87171;
        --ok: #3fb950;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; height: 100%;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.5 "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }
      body::before {
        content: "";
        position: fixed; inset: 0;
        background:
          radial-gradient(1100px 620px at 50% -10%, rgba(34, 211, 238, .10), transparent 62%),
          radial-gradient(760px 460px at 12% 108%, rgba(56, 118, 255, .08), transparent 60%);
        pointer-events: none;
      }

      .app { position: relative; height: 100%; display: grid; grid-template-columns: 248px 1fr; }

      /* ------------------------------------------------------------ sidebar -- */
      .side {
        border-right: 1px solid var(--edge);
        background: rgba(11, 17, 28, .72);
        padding: 14px 10px;
        display: flex; flex-direction: column; gap: 10px;
      }
      .brand { display: flex; align-items: center; gap: 9px; padding: 2px 6px 6px; }
      .brand svg { width: 22px; height: 22px; }
      .brand span { font-size: 13.5px; font-weight: 600; letter-spacing: .01em; }
      .newchat {
        display: flex; align-items: center; gap: 8px;
        border: 1px solid var(--edge); border-radius: 10px;
        background: #0e1626; color: var(--faint);
        padding: 8px 10px; font-size: 13px;
      }
      .side-note {
        margin: 6px 6px 0; font-size: 11.5px; line-height: 1.7; color: var(--faint);
      }

      /* --------------------------------------------------------------- main -- */
      .main { display: flex; flex-direction: column; min-width: 0; }
      .top {
        height: 46px; flex: none;
        display: flex; align-items: center; gap: 10px;
        padding: 0 20px; border-bottom: 1px solid var(--edge);
        color: var(--muted); font-size: 12.5px;
      }
      .stream {
        flex: 1; min-height: 0; overflow: hidden;
        display: flex; align-items: center; justify-content: center;
        padding: 24px;
      }
      .intro { text-align: center; max-width: 460px; }
      .intro h1 {
        margin: 0 0 10px; font-size: 19px; font-weight: 600; letter-spacing: .01em;
        display: flex; align-items: center; justify-content: center; gap: 10px;
      }
      .intro p { margin: 0; font-size: 13px; line-height: 1.8; color: var(--muted); }
      .spin {
        width: 15px; height: 15px; flex: none; border-radius: 50%;
        border: 2px solid rgba(34, 211, 238, .25); border-top-color: var(--accent);
        animation: aw-spin .8s linear infinite;
      }
      @keyframes aw-spin { to { transform: rotate(360deg); } }

      /* ----------------------------------------------------------- composer -- */
      .composer { flex: none; padding: 0 20px 16px; }
      .box {
        display: flex; align-items: flex-end; gap: 8px;
        border: 1px solid var(--edge); border-radius: 14px;
        background: #0a1220; padding: 10px 10px 10px 14px;
      }
      .box textarea {
        flex: 1; min-height: 22px; max-height: 120px; resize: none;
        border: 0; outline: 0; background: transparent;
        color: var(--text); font: inherit; line-height: 1.5;
      }
      .box textarea::placeholder { color: var(--faint); }
      .box button {
        flex: none; display: inline-flex; align-items: center; gap: 6px;
        border: 1px solid var(--edge); border-radius: 9px;
        background: #101a2c; color: var(--faint);
        padding: 7px 13px; font: inherit; font-size: 13px; cursor: not-allowed;
      }
      .why { margin: 8px 4px 0; font-size: 11.5px; color: var(--faint); }
      .statusline {
        display: flex; align-items: center; gap: 8px;
        margin: 0 4px 8px; font-size: 11.5px; color: var(--muted);
      }
      .statusline .pip {
        width: 7px; height: 7px; flex: none; border-radius: 50%;
        background: var(--accent); animation: aw-pulse 1.2s ease-in-out infinite;
      }
      .statusline[data-state="ready"] .pip { background: var(--ok); animation: none; }
      .statusline[data-state="failed"] .pip { background: var(--danger); animation: none; }
      @keyframes aw-pulse { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
      .statusline .what { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .statusline .elapsed { margin-left: auto; flex: none; font-variant-numeric: tabular-nums; color: var(--faint); }

      /* -------------------------------------------------------------- error -- */
      .error {
        position: fixed; inset: 0; display: none;
        align-items: center; justify-content: center; padding: 40px;
        background: rgba(5, 7, 13, .93);
      }
      .error.show { display: flex; }
      .error .card {
        max-width: 620px; width: 100%;
        border: 1px solid rgba(248, 113, 113, .35); border-radius: 14px;
        background: var(--panel); padding: 22px;
      }
      .error h2 { margin: 0 0 10px; font-size: 16px; color: var(--danger); }
      .error p { margin: 0 0 12px; font-size: 13px; color: var(--muted); }
      .error pre {
        margin: 0 0 16px; padding: 11px; max-height: 210px; overflow: auto;
        border: 1px solid var(--edge); border-radius: 9px; background: #070d18;
        color: var(--muted); font-size: 11.5px; line-height: 1.6; white-space: pre-wrap;
      }
      .error .actions { display: flex; gap: 9px; }
      .error button {
        border: 1px solid var(--edge); border-radius: 9px;
        background: #101a2c; color: var(--text);
        padding: 8px 15px; font: inherit; font-size: 13px; cursor: pointer;
      }
      .error button.primary { border-color: var(--accent-dim); background: rgba(34, 211, 238, .13); color: var(--accent); }
      .error .hint { margin: 14px 0 0; font-size: 11.5px; color: var(--faint); }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="side">
        <div class="brand">
          <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
            <path d="M6 20.5 16 4l10 16.5" stroke="#22d3ee" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M10.5 25.5h11" stroke="#0e7490" stroke-width="2.4" stroke-linecap="round"/>
          </svg>
          <span>AI Workbench</span>
        </div>
        <div class="newchat">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M12 5v14M5 12h14" stroke-linecap="round"/>
          </svg>
          新对话
        </div>
        <p class="side-note">服务起来之后，这里的会话列表就出来了。</p>
      </aside>

      <main class="main">
        <header class="top" id="topLine">正在启动服务…</header>

        <section class="stream">
          <div class="intro" id="intro">
            <h1><span class="spin"></span>正在启动服务…</h1>
            <p id="introDetail">数据库 · 缓存 · 向量库 · 接口</p>
          </div>
        </section>

        <footer class="composer">
          <!-- One small line. This is the whole of the "progress UI". -->
          <div class="statusline" id="statusline" data-state="pending">
            <span class="pip"></span>
            <span class="what" id="activity">正在启动…</span>
            <span class="elapsed" id="elapsed">0s</span>
          </div>

          <div class="box">
            <!-- A real textarea. Enabled from the first frame on purpose: the point of
                 this screen is that the user can start working before the backend is
                 up, and the draft is carried into the app. -->
            <textarea
              id="draft"
              rows="1"
              data-testid="startup-draft"
              placeholder="先把想说的话打在这里也行，服务好了会带过去"
            ></textarea>
            <button id="send" disabled type="button" data-testid="startup-send">发送</button>
          </div>
          <p class="why" id="why">服务还在启动，好了就能发。你先打字，不会丢。</p>
        </footer>
      </main>
    </div>

    <div class="error" id="error">
      <div class="card">
        <h2 id="errorTitle">启动失败</h2>
        <p id="errorDetail"></p>
        <pre id="errorLog"></pre>
        <div class="actions">
          <button class="primary" id="retry" type="button">重试</button>
          <button id="logs" type="button">打开日志目录</button>
        </div>
        <p class="hint">如果重试还是不行，把上面的内容发给开发者。</p>
      </div>
    </div>

    <script>
      // The shell injects a narrow API here (see tauri.conf.json `withGlobalTauri`).
      // Only event listening and the lifecycle commands are used — this page never asks
      // the OS to run anything.
      const api = window.__TAURI__ || {};
      const started = Date.now();

      const els = {
        intro: document.getElementById("intro"),
        introDetail: document.getElementById("introDetail"),
        topLine: document.getElementById("topLine"),
        statusline: document.getElementById("statusline"),
        activity: document.getElementById("activity"),
        elapsed: document.getElementById("elapsed"),
        why: document.getElementById("why"),
        draft: document.getElementById("draft"),
        send: document.getElementById("send"),
        error: document.getElementById("error"),
        errorTitle: document.getElementById("errorTitle"),
        errorDetail: document.getElementById("errorDetail"),
        errorLog: document.getElementById("errorLog"),
        retry: document.getElementById("retry"),
        logs: document.getElementById("logs"),
      };

      setInterval(() => {
        els.elapsed.textContent = Math.round((Date.now() - started) / 1000) + "s";
      }, 250);

      /* -------------------------------------------------- the draft survives -- */
      //
      // Pushed to the shell on every keystroke rather than read out of this page when the
      // app is ready: the shell navigates from its own thread the instant `/health`
      // answers, and asking a page for a value at that moment is a race. See
      // `set_startup_draft` in `commands.rs`.
      let draftTimer = null;
      els.draft.addEventListener("input", () => {
        // Grow to fit, up to the CSS max-height. A one-line box that hides what you typed
        // is a box that discourages typing.
        els.draft.style.height = "auto";
        els.draft.style.height = Math.min(els.draft.scrollHeight, 120) + "px";
        // Debounced: this crosses the IPC boundary, and one message per keystroke for a
        // long paste is wasteful. 120 ms is under the gap between deliberate keystrokes.
        if (draftTimer) clearTimeout(draftTimer);
        draftTimer = setTimeout(pushDraft, 120);
      });
      // Also on blur and before unload, so nothing typed in the last 120 ms is lost.
      els.draft.addEventListener("blur", pushDraft);
      window.addEventListener("beforeunload", pushDraft);

      function pushDraft() {
        if (!api.core || !api.core.invoke) return;
        api.core.invoke("set_startup_draft", { text: els.draft.value }).catch(() => {});
      }

      els.draft.focus();

      /* ---------------------------------------------------------- the status -- */
      function apply(status) {
        if (!status) return;

        if (status.phase === "failed") {
          showError(status);
          return;
        }

        els.error.classList.remove("show");

        if (status.ok && status.finished) {
          // The shell navigates on its own; this is only so the last frame is not a lie.
          els.statusline.dataset.state = "ready";
          els.activity.textContent = "服务好了，正在打开…";
          els.topLine.textContent = "服务好了，正在打开…";
          els.intro.innerHTML = '<h1 style="display:block">服务好了，正在打开…</h1>';
          els.why.textContent = "你打的话会带过去。";
          return;
        }

        // The message is the product's own words for this phase, and the activity line is
        // the last thing the startup script wrote — a real fact from the log, not a
        // sentence invented to fill the space.
        els.statusline.dataset.state = "pending";
        els.topLine.textContent = status.message || "正在启动服务…";
        els.intro.querySelector("h1").lastChild.textContent = status.message || "正在启动服务…";
        if (status.detail) els.introDetail.textContent = status.detail;
        els.activity.textContent = status.detail || status.message || "正在启动…";

        // Say *why* the button is greyed, per service, rather than one generic sentence:
        // "PostgreSQL 还没起来" is actionable, "服务未就绪" is not.
        const pending = (status.services || []).filter((s) => s.state !== "ready").map((s) => s.name);
        els.why.textContent = pending.length
          ? `还在等：${pending.join('、')}。好了就能发，你先打字不会丢。`
          : "马上就好，你先打字不会丢。";
      }

      function showError(status) {
        els.error.classList.add("show");
        els.statusline.dataset.state = "failed";
        els.errorTitle.textContent = status.message || "启动失败";
        els.errorDetail.textContent = status.detail ? "" : "没有更多细节。";
        els.errorLog.textContent = status.detail || "";
      }

      if (api.event && api.event.listen) {
        api.event.listen("startup://status", (event) => apply(event.payload));
      }

      // Pull the current state once: the first events may have fired before this page
      // finished loading.
      if (api.core && api.core.invoke) {
        api.core.invoke("startup_status").then(apply).catch(() => {});
      }

      els.retry.addEventListener("click", () => {
        els.error.classList.remove("show");
        els.statusline.dataset.state = "pending";
        els.activity.textContent = "正在重试…";
        if (api.core && api.core.invoke) {
          api.core.invoke("restart_backend").catch(() => {});
        }
      });

      els.logs.addEventListener("click", () => {
        if (api.core && api.core.invoke) {
          api.core.invoke("open_log_folder").catch(() => {});
        }
      });
    </script>
  </body>
</html>
