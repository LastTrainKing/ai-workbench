name: CI

# 静态检查 + 后端测试。**这是唯一一个自动运行的 workflow。**
#
# 它**不**构建 Windows 安装包 —— 那需要 485 MB 的运行时（PostgreSQL / Redis /
# Qdrant 的 Windows 二进制）与 NSIS，且产物 119 MB。把它塞进每次 push 的流水线
# 既慢又没有意义。安装包的构建是 `windows-installer.yml`，**手动触发**，
# 且不会伪装成"已自动验证"。
#
# 状态：**本文件尚未在 GitHub 上执行过。** 命令与本地跑的完全一致
# （见 docs/release/TEST_REPORT.md），但"本地通过"不等于"CI 通过"，
# 所以 README 里不放徽章。

on:
  push:
    branches: [main, master, "feat/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: 安装依赖
        run: pip install -r backend/requirements-dev.txt

      # **不要加 `--config backend/pyproject.toml`。**
      #
      # 加了它，`per-file-ignores` 里的 `tests/**` 就不再匹配 —— 那些 glob 是相对
      # *配置文件所在目录* 解析的，而 `--config` 会让 ruff 以调用目录为基准。
      # 结果：`tests/**` 的 E402/F401 豁免全部失效，CI 报 131 个错误而本地报 0。
      #
      # 这个错是**在干净克隆里用全新 venv 跑一遍 CI 的命令**才发现的。所以这一行
      # 现在没有 `--config`：让 ruff 自己按文件就近发现配置。
      #
      # 已知的范围事实：`backend/**` 用 `backend/pyproject.toml` 的规则集，
      # `tools/**` 用 `tools/ruff.toml`（**与 backend 逐条相同**），
      # 而 `desktop-native/**` 没有自己的配置，走 ruff 的默认规则集（E4/E7/E9/F）。
      # 这是项目既有范围，本轮未扩大；见 docs/release/TEST_REPORT.md §5。
      #
      # `tools/` 是 2026-10-15 加进来的。它此前从没被 lint 过，用默认规则集报 21 个问题 ——
      # 其中 15 个是 `RUF100 unused noqa (non-enabled: E402)`：这些脚本在 import 之前插
      # `sys.path`，所以带着 `# noqa: E402`，而默认规则集不启用 E402，于是"正确的指令"
      # 被报成多余的。给它一份与 backend 相同的配置后，真正的问题只剩 8 个，已全部修掉。
      # **两套规则集是"linter 通过"在同一个仓库里含义不同的开始，所以它们必须一致。**
      - name: ruff
        run: ruff check backend/app backend/tests desktop-native tools

      # 格式检查（KI-03 的守卫）。此前 CI 只跑 `ruff check`，不查格式，
      # 所以 `docs/testing.md` 里写的 `ruff format --check` 从来没被守住过，
      # 一路飘到 136 个文件不合规。现在把它接进 CI，防止再漂。
      - name: ruff format
        working-directory: backend
        run: ruff format --check app tests

      # 文档里的相对链接必须指向存在的东西。**没有任何东西会在链接烂掉时报错**，
      # 所以它只能靠一条会失败的检查守着。第一次跑就抓到两个：`docs/archive/`
      # 里两个链接写成了仓库根相对，而文件本身在下一层 —— 目标存在、链接是断的。
      #
      # 它不检查外部 URL：那需要网络请求，而 CI 不该依赖别人的可用性。
      - name: 文档链接
        run: python tools/check_doc_links.py

  test:
    name: 后端测试
    runs-on: ubuntu-latest

    # 与 `docker-compose.yml` 同版本。**不是 stub**：这套测试的价值有一半来自
    # "真的能连上 Postgres / Redis / Qdrant"，换成假实现等于在测另一个产品。
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aiworkbench
          POSTGRES_PASSWORD: aiworkbench
          POSTGRES_DB: aiworkbench_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aiworkbench"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      qdrant:
        image: qdrant/qdrant:v1.12.4
        ports:
          - 6333:6333
          - 6334:6334

    env:
      # `conftest.py` 自己会设这些值；写在这里是让"CI 用的是哪套基础设施"在
      # 日志里可见，而不是藏在 Python 文件里。
      DATABASE_URL: postgresql+asyncpg://aiworkbench:aiworkbench@127.0.0.1:5432/aiworkbench_test
      REDIS_URL: redis://127.0.0.1:6379/1
      QDRANT_URL: http://127.0.0.1:6333
      QDRANT_COLLECTION: ai_workbench_chunks_test
      AI_PROVIDER: offline
      EMBEDDING_PROVIDER: offline

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      # **Qt 的系统库，CI 里必须显式装。**
      #
      # `PySide6-Essentials` 的 Linux wheel **不自带** libGL / libEGL —— 它链接系统的那一份。
      # Ubuntu runner 上没有，于是 `import PySide6` 抛
      # `ImportError: libGL.so.1: cannot open shared object file`。而两个测试模块在**模块级**
      # 导入它（`test_native_bridge_session.py`、`test_ai_config_status.py`，它们要驱动桥接层），
      # 于是：**模块级导入失败 = 收集错误 = pytest 退出码 2 = 整个套件一个都不跑。**
      #
      # 第一次 CI 跑就是这个结果：1 分 9 秒、failure、**1533 个测试从未执行**，
      # 而其中 1530 个和 Qt 毫无关系。
      #
      # **本地看不见这个缺陷**，因为开发机上 PySide6 从写桌面端那天起就装着，
      # 而它的系统库在 Windows 上是随 wheel 来的。这是"开发机看不见"的又一个形态 ——
      # 前几次是缺依赖文件、是 `--config` 让 glob 失效，这次是缺操作系统的库。
      - name: Qt 系统库
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libgl1 libegl1 libxkbcommon0 libxkbcommon-x11-0 \
            libdbus-1-3 libfontconfig1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xkb1 libxcb-xinerama0

      - name: 安装依赖
        run: pip install -r backend/requirements-dev.txt

      - name: 等待基础设施
        run: |
          for i in $(seq 1 30); do
            pg_isready -h 127.0.0.1 -p 5432 -U aiworkbench && break
            sleep 2
          done
          curl -sf http://127.0.0.1:6333/readyz || curl -sf http://127.0.0.1:6333/ || true

      # **先跑一遍收集阶段，并把它的输出和退出码贴在作业页上。**
      #
      # 这是被逼出来的：CI 在 `pytest` 上以退出码 2 失败（= **收集错误，一个测试都没跑**），
      # 而 GitHub 的原始日志页未登录时抓不到 —— `data-log-url` 是空的。于是"CI 红了"和
      # "为什么红"之间隔着一个看不见的页面。
      # `$GITHUB_STEP_SUMMARY` 写的东西**渲染在作业页正文**里，不用点开日志、不用登录。
      #
      # **退出码必须原样交出去。** 第一版写成 `pytest ... | tail -50`，而管道的退出码是
      # `tail` 的 —— 于是这一步在收集真的失败时**显示成功**，我因此一度以为收集是好的、
      # 转而怀疑别处。一个会撒谎的诊断步骤比没有诊断更坏。
      - name: 收集阶段自检（输出与退出码贴在作业页上）
        if: always()
        working-directory: backend
        run: |
          set +e
          python -m pytest tests --collect-only -q -p no:randomly > /tmp/collect.txt 2>&1
          collect_code=$?
          set -e
          {
            echo "### 收集阶段自检 —— 退出码 $collect_code"
            echo ""
            echo '```'
            tail -60 /tmp/collect.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$collect_code"

      # `-rs` 让每一个 skip 都带着原因出现在日志里。**这是有意的**：
      # 11 个 skip 里 6 个是真实模型测试（CI 不配 Key，所以它们不跑），
      # 一个不说原因的 skip 与一个静默通过的测试没有区别。
      #
      # `tee` 保留退出码：管道会吞掉右边的退出状态，而一个"测试失败了但作业成功了"的
      # CI 比没有 CI 更糟。`PIPESTATUS[0]` 是 pytest 的，`exit` 把它交回给 GitHub。
      - name: pytest
        working-directory: backend
        run: |
          python -m pytest tests -q -p no:randomly --tb=short -rs 2>&1 | tee pytest-output.txt
          exit "${PIPESTATUS[0]}"

      # 同上：**测试失败的原因也要贴在作业页上。** 未登录抓不到原始日志，而这个可以。
      - name: 把 pytest 输出贴到作业页
        if: always()
        working-directory: backend
        run: |
          {
            echo "### pytest 输出（末尾 60 行）"
            echo ""
            echo '```'
            tail -60 pytest-output.txt 2>/dev/null || echo "(没有输出文件)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传测试日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: backend/.pytest_cache/v/cache/lastfailed
          if-no-files-found: ignore
