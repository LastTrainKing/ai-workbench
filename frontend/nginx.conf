# AI Workbench — Nginx configuration for the SPA container.
# Serves the built frontend and reverse-proxies the API, so the browser only
# ever talks to one origin (no CORS, no hard-coded backend URL).

upstream ai_workbench_api {
    server api:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads are capped at MAX_UPLOAD_MB in the backend; give Nginx headroom.
    client_max_body_size 32m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Immutable hashed assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://ai_workbench_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Long AI calls (RAG / planner / agent) must not be cut short.
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_connect_timeout  10s;
        proxy_buffering       off;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Client-side routing: unknown paths fall through to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
